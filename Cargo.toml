[package]
name = "nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gpui-ce = "0.2.2"
gpui_platform = { version = "0.1.0", package = "gpui_ce_platform" }
# The look lives in its own repository so other projects can wear the same skin. It is a git
# dependency rather than a path one on purpose: a `path` would work only on a machine that happens
# to have the checkout next to this one.
nexus-look = { git = "ssh://git@github.com/Gakusyun/Nexus-look.git", branch = "main" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
gpui-ce = { version = "0.2.2", features = ["test-support"] }
